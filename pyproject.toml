[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "detect"
version = "0.0.1"
description = "Behavioral detection pipeline for Windows host telemetry (Sysmon/Security)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

# Floors here express minimum supported APIs; exact versions are frozen in
# requirements.lock (`make lock`) for byte-for-byte reproducible runs. This
# avoids hard pins that lack wheels on newer Python while still pinning what
# actually gets installed. See README "Reproduce".
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=17",       # Parquet I/O for the normalized event store
    "pyyaml>=6",         # Sigma-style rule definitions
    "evtx>=0.8.7",       # .evtx parser: Rust-backed (pyevtx-rs), JSON output
    "matplotlib>=3.8",   # per-technique recall figure
    "tabulate>=0.9",     # markdown result tables (pandas to_markdown)
]

[project.optional-dependencies]
# Pure-Python .evtx parser fallback for platforms without an `evtx` wheel
# (ARM, Windows w/o Rust). Slower; see docs/design.md.
parsers-pure = [
    "python-evtx>=0.7.4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
