[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "detect"
version = "0.0.1"
description = "Behavioral detection pipeline for Windows host telemetry (Sysmon/Security)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Pinned with compatible-release (~=) so a re-run reproduces results.
# Promote to an exact lockfile (pip-tools / uv) once the stack is frozen.
dependencies = [
    "pandas~=2.2.3",
    "numpy~=2.1.0",
    "scikit-learn~=1.5.2",
    "pyarrow~=17.0",      # Parquet I/O for the normalized event store
    "pyyaml~=6.0.2",      # Sigma-style rule definitions
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.3",
    "pytest-cov~=5.0.0",
    "ruff~=0.6.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
